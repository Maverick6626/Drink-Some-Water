
name: Android Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate Version
        id: version
        run: |
          git fetch --tags --force

          LATEST=$(git tag --list '[vV]?[0-9]*' \
            --sort=-version:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            VERSION="1.0.0"
          else
            VERSION=${LATEST#v}
            VERSION=${VERSION#V}

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next release: v$VERSION"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.APP_KEYSTORE_BASE64 }}" |
            base64 --decode > app/release-keystore.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.version }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Drink Some Water v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
